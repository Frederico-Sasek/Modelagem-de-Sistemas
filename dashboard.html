<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ShowFinance | Painel</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="dashboard-container">
      <header class="dashboard-header">
        <h1>ShowFinance</h1>
        <div class="user-info">
          <span id="usuario-email"></span>
          <button id="btn-sair">Sair</button>
        </div>
      </header>

      <section class="shows-section">
        <section class="shows-section">
          <h2>Meus Shows</h2>

          <p>Cadastre e gerencie seus eventos.</p>

          <div class="show-form-container">
            <h3>Cadastrar novo show</h3>

            <form id="cadastro-show-form">
              <div class="form-group">
                <label for="nome-show">Nome do show</label>
                <input
                  type="text"
                  id="nome-show"
                  placeholder="Ex: Festival de Música"
                  required
                />
              </div>

              <div class="form-group">
                <label for="data-show">Data do evento</label>
                <input type="date" id="data-show" required />
              </div>

              <div class="form-group">
                <label for="local-show">Local</label>
                <input
                  type="text"
                  id="local-show"
                  placeholder="Local do evento"
                />
              </div>

              <div class="form-group">
                <label for="descricao-show">Descrição</label>
                <textarea
                  id="descricao-show"
                  placeholder="Informações adicionais"
                ></textarea>
              </div>

              <button type="submit">Cadastrar show</button>

              <p id="mensagem-show"></p>
            </form>
          </div>

          <div class="shows-list-container">
            <h3>Shows cadastrados</h3>

            <div id="lista-shows"></div>
          </div>
        </section>
        <div id="lista-shows"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
